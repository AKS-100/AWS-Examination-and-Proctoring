version: 1.0
runtime: nodejs20
build:
  commands:
    build:
      - npm ci --omit=dev
run:
  command: node src/server.js
  network:
    port: 5000
  env:
    - name: NODE_ENV
      value: production
    - name: PORT
      value: "5000"
    - name: AWS_REGION
      value: ap-south-1
    - name: DATABASE_MODE
      value: dynamodb
